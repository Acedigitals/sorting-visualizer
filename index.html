<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visualize Bubble Sort, Selection Sort, and Insertion Sort step by step.">
  <meta property="og:title" content="Sorting Visualizer">
  <meta property="og:description" content="An interactive visualizer for three sorting algorithms.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/preview.png">
  <title>Sorting Visualizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f14'/%3E%3Crect x='10' y='34' width='8' height='20' rx='2' fill='%2379b8ff'/%3E%3Crect x='28' y='22' width='8' height='32' rx='2' fill='%237ee787'/%3E%3Crect x='46' y='10' width='8' height='44' rx='2' fill='%23f2cc60'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">ALGORITHM LAB</p>
      <h1>Sorting Visualizer</h1>
      <p class="subtitle">Watch sorting algorithms organize your numbers.</p>
    </header>

    <section class="card controls-card">
      <div class="section-heading">
        <h2>Controls</h2>
        <span class="section-label">CONFIGURE RUN</span>
      </div>
      <div class="button-row">
        <button class="button-secondary" id="new-array-button">New array</button>
        <button class="button-primary" id="sort-button">Sort</button>
        <button class="button-secondary" id="stop-button" disabled>Stop</button>
        <label class="select-label" for="algorithm-picker">Algorithm</label>
        <select id="algorithm-picker">
          <option value="bubble">Bubble sort</option>
          <option value="selection">Selection sort</option>
          <option value="insertion">Insertion sort</option>
        </select>
      </div>

      <label for="speed-slider">Animation speed <span id="speed-level">Medium</span></label>
      <input
        id="speed-slider"
        type="range"
        min="50"
        max="950"
        value="500"
      >
    </section>

    <section class="card custom-card">
      <div class="section-heading">
        <h2>Your own numbers</h2>
        <span class="section-label">OPTIONAL INPUT</span>
      </div>
      <label for="custom-input">Enter comma-separated values</label>
      <div class="custom-input-row">
        <input
          id="custom-input"
          type="text"
          placeholder="5, 12, 3, 40"
        >
        <button class="button-secondary" id="apply-custom-button">Use these numbers</button>
      </div>
      <p id="input-error" aria-live="polite"></p>
    </section>

    <section class="stats-row" aria-label="Sorting statistics">
      <div class="stat-item">
        <span>Algorithm</span>
        <strong id="algorithm-stat">Bubble sort</strong>
      </div>
      <div class="stat-item">
        <span>Array size</span>
        <strong id="array-size-stat">20</strong>
      </div>
      <div class="stat-item">
        <span>Comparisons</span>
        <strong id="comparisons-counter">0</strong>
      </div>
    </section>

    <p id="sort-status" class="visually-hidden" aria-live="polite"></p>

    <section class="info-card" aria-live="polite">
      <p id="algorithm-description"></p>
      <p id="algorithm-complexity" class="complexity"></p>
    </section>

    <section class="chart-card">
      <div id="bars-container"></div>
      <div class="legend" aria-label="Bar color legend">
        <span><i class="legend-swatch unsorted"></i>Unsorted</span>
        <span><i class="legend-swatch comparing"></i>Comparing</span>
        <span><i class="legend-swatch sorted"></i>Sorted</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
